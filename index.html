<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Presupuesto Personal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <div class="container mx-auto p-4 max-w-5xl">
    <header class="text-center my-6">
      <h1 class="text-3xl font-bold text-blue-600">Gestor de Presupuesto Personal</h1>
      <p class="text-gray-600 text-sm mt-1">Controla tus ingresos y gastos en tiempo real</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
        <h2 class="text-gray-500 text-sm font-semibold uppercase">Saldo Total</h2>
        <p id="saldo-total" class="text-2xl font-bold text-gray-800 mt-1">S/. 0.00</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
        <h2 class="text-gray-500 text-sm font-semibold uppercase">Ingresos</h2>
        <p id="total-ingresos" class="text-2xl font-bold text-green-600 mt-1">S/. 0.00</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500">
        <h2 class="text-gray-500 text-sm font-semibold uppercase">Gastos</h2>
        <p id="total-gastos" class="text-2xl font-bold text-red-600 mt-1">S/. 0.00</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <div class="bg-white p-6 rounded-xl shadow md:col-span-1 h-fit">
        <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">Registrar Movimiento</h2>
        <form id="form-movimiento" class="space-y-4">
          <div>
            <label for="concepto" class="block text-sm font-medium text-gray-700">Concepto</label>
            <input type="text" id="concepto" required placeholder="Ej. Sueldo, Mercado, Laptop" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 border p-2 focus:border-blue-500 focus:bg-white focus:outline-none">
          </div>

          <div>
            <label for="monto" class="block text-sm font-medium text-gray-700">Monto (S/.)</label>
            <input type="number" step="0.01" min="0.01" id="monto" required placeholder="0.00" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 border p-2 focus:border-blue-500 focus:bg-white focus:outline-none">
          </div>

          <div>
            <label for="tipo" class="block text-sm font-medium text-gray-700">Tipo de Movimiento</label>
            <select id="tipo" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 border p-2 focus:border-blue-500 focus:bg-white focus:outline-none">
              <option value="ingreso">Ingreso</option>
              <option value="gasto">Gasto</option>
            </select>
          </div>

          <div>
            <label for="categoria" class="block text-sm font-medium text-gray-700">Categoría (HU1)</label>
            <select id="categoria" class="mt-1 block w-full rounded-md border-gray-300 bg-gray-50 border p-2 focus:border-blue-500 focus:bg-white focus:outline-none">
              <option value="General">General</option>
              <option value="Trabajo">Trabajo</option>
              <option value="Alimentación">Alimentación</option>
              <option value="Servicios">Servicios</option>
              <option value="Entretenimiento">Entretenimiento</option>
            </select>
          </div>

          <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md font-semibold hover:bg-blue-700 transition duration-200 shadow">
            Agregar Movimiento
          </button>
        </form>
      </div>

      <div class="bg-white p-6 rounded-xl shadow md:col-span-2 space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b pb-3 gap-2">
          <h2 class="text-xl font-bold text-gray-700">Historial de Movimientos</h2>
          
          <div class="flex items-center gap-2">
            <label for="filtro-tipo" class="text-xs font-semibold text-gray-500 uppercase">Filtrar (HU2):</label>
            <select id="filtro-tipo" class="text-sm rounded-md border-gray-300 bg-gray-50 border p-1 focus:outline-none">
              <option value="todos">Todos</option>
              <option value="ingreso">Ingresos</option>
              <option value="gasto">Gastos</option>
            </select>
          </div>
        </div>

        <ul id="lista-movimientos" class="divide-y divide-gray-200">
        </ul>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
